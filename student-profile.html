<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student profile - Unique Academic."
    >

    <title>Student Profile | Unique Academic</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .profilePage {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        .profileCard {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 25px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .profileAvatarLarge {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            font-size: 45px;
        }

        .profileCard h2 {
            margin: 5px 0;
        }

        .profileCard p {
            color: #64748b;
            margin: 5px 0 15px;
        }

        .profileStatus {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 14px;
            font-weight: 600;
        }

        .profileSection {
            margin-bottom: 25px;
        }

        .profileSection > h2 {
            margin-bottom: 15px;
        }

        .profileInfoCard {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .profileRow {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profileRow:last-child {
            border-bottom: none;
        }

        .profileRow span {
            color: #64748b;
        }

        .profileRow strong {
            text-align: right;
            word-break: break-word;
        }

        .profileStats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .profileStat {
            background: white;
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .profileStatIcon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .profileStat strong {
            display: block;
            font-size: 24px;
        }

        .profileStat span {
            color: #64748b;
            font-size: 14px;
        }

        .profileActions {
            display: grid;
            gap: 10px;
        }

        .profileAction {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            border: none;
            border-radius: 13px;
            background: white;
            color: inherit;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            text-align: left;
        }

        .profileAction span {
            flex: 1;
        }

        .profileAction b {
            font-size: 22px;
        }

        .profileLogout {
            text-align: center;
            margin-top: 30px;
        }

        .profileLogout button {
            padding: 13px 30px;
            border: none;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .profileLogout button:hover {
            background: #b91c1c;
        }

        .profileMessage {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .profileMessage.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {

            .profileStats {
                grid-template-columns: 1fr;
            }

            .profileRow {
                flex-direction: column;
                gap: 5px;
            }

            .profileRow strong {
                text-align: left;
            }

            .pageHomeText,
            .pageBackText {
                display: none;
            }

        }

    </style>

</head>


<body>


<header class="pageNav">

    <button
        id="pageBackBtn"
        class="pageBackBtn"
        type="button"
    >
        ← <span class="pageBackText">Back</span>
    </button>


    <div class="pageTitle">

        <span class="pageTitleIcon">
            👤
        </span>

        <div>

            <h1>
                Student Profile
            </h1>

            <p>
                Unique Academic
            </p>

        </div>

    </div>


    <button
        id="pageHomeBtn"
        class="pageHomeBtn"
        type="button"
    >
        🏠 <span class="pageHomeText">Home</span>
    </button>

</header>



<main class="profilePage">


    <div
        id="profileMessage"
        class="profileMessage"
    ></div>


    <!-- PROFILE HEADER -->

    <section class="profileCard">

        <div class="profileAvatarLarge">
            👤
        </div>


        <h2 id="profileName">
            Loading...
        </h2>


        <p id="profileEmail">
            Loading...
        </p>


        <span class="profileStatus">
            🟢 Active Student
        </span>

    </section>



    <!-- ACCOUNT INFORMATION -->

    <section class="profileSection">

        <h2>
            📋 Account Information
        </h2>


        <div class="profileInfoCard">

            <div class="profileRow">

                <span>
                    👤 Name
                </span>

                <strong id="studentName">
                    Loading...
                </strong>

            </div>


            <div class="profileRow">

                <span>
                    📧 Email
                </span>

                <strong id="studentEmail">
                    Loading...
                </strong>

            </div>


            <div class="profileRow">

                <span>
                    🎓 Status
                </span>

                <strong>
                    Active Student
                </strong>

            </div>


            <div class="profileRow">

                <span>
                    📚 Program
                </span>

                <strong id="studentProgram">
                    Freshman
                </strong>

            </div>

        </div>

    </section>



    <!-- LEARNING -->

    <section class="profileSection">

        <h2>
            📚 My Learning
        </h2>


        <div class="profileStats">

            <div class="profileStat">

                <div class="profileStatIcon">
                    📖
                </div>

                <strong id="subjectCount">
                    12
                </strong>

                <span>
                    Subjects
                </span>

            </div>


            <div class="profileStat">

                <div class="profileStatIcon">
                    📝
                </div>

                <strong id="quizCount">
                    0
                </strong>

                <span>
                    Quizzes
                </span>

            </div>


            <div class="profileStat">

                <div class="profileStatIcon">
                    ⭐
                </div>

                <strong id="bookmarkCount">
                    0
                </strong>

                <span>
                    Bookmarks
                </span>

            </div>

        </div>

    </section>



    <!-- QUICK ACTIONS -->

    <section class="profileSection">

        <h2>
            ⚡ Quick Actions
        </h2>


        <div class="profileActions">

            <a
                href="index.html#subjects"
                class="profileAction"
            >

                📚

                <span>
                    Browse Subjects
                </span>

                <b>
                    ›
                </b>

            </a>


            <a
                href="index.html#subjects"
                class="profileAction"
            >

                📝

                <span>
                    Take a Quiz
                </span>

                <b>
                    ›
                </b>

            </a>


            <button
                id="profileRefreshBtn"
                class="profileAction"
                type="button"
            >

                🔄

                <span>
                    Refresh Profile
                </span>

                <b>
                    ›
                </b>

            </button>

        </div>

    </section>



    <!-- LOGOUT -->

    <section class="profileLogout">

        <button
            id="profileLogoutBtn"
            type="button"
        >
            🚪 Logout
        </button>

    </section>


</main>



<script type="module">

import { auth } from "./firebase-config.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";



const profileName =
    document.getElementById("profileName");

const profileEmail =
    document.getElementById("profileEmail");

const studentName =
    document.getElementById("studentName");

const studentEmail =
    document.getElementById("studentEmail");

const studentProgram =
    document.getElementById("studentProgram");

const bookmarkCount =
    document.getElementById("bookmarkCount");

const profileMessage =
    document.getElementById("profileMessage");



/* =========================================
   NAVIGATION
========================================= */

document
    .getElementById("pageBackBtn")
    .addEventListener(
        "click",
        function () {

            if (history.length > 1) {

                history.back();

            } else {

                window.location.href =
                    "index.html";

            }

        }
    );


document
    .getElementById("pageHomeBtn")
    .addEventListener(
        "click",
        function () {

            window.location.href =
                "index.html";

        }
    );


document
    .getElementById("profileRefreshBtn")
    .addEventListener(
        "click",
        function () {

            location.reload();

        }
    );



/* =========================================
   FIREBASE USER
========================================= */

onAuthStateChanged(
    auth,
    function (user) {

        if (!user) {

            window.location.replace(
                "student-login.html"
            );

            return;

        }


        const name =
            user.displayName ||
            getSavedStudentName() ||
            "Student";


        const email =
            user.email ||
            "Not available";


        profileName.textContent =
            name;

        profileEmail.textContent =
            email;

        studentName.textContent =
            name;

        studentEmail.textContent =
            email;


        loadBookmarks();


        /*
         * Keep compatibility with
         * existing project.
         */

        localStorage.setItem(
            "studentLoggedIn",
            "true"
        );


        localStorage.setItem(
            "uniqueAcademicUser",
            JSON.stringify({
                uid: user.uid,
                email: user.email,
                displayName: name
            })
        );

    }
);



/* =========================================
   GET SAVED NAME
========================================= */

function getSavedStudentName() {

    try {

        const saved =
            localStorage.getItem(
                "uniqueAcademicUser"
            );


        if (!saved) {
            return "";
        }


        const data =
            JSON.parse(saved);


        return data.displayName || "";

    }

    catch (error) {

        return "";

    }

}



/* =========================================
   BOOKMARK COUNT
========================================= */

function loadBookmarks() {

    let count = 0;


    for (
        let i = 0;
        i < localStorage.length;
        i++
    ) {

        const key =
            localStorage.key(i);


        if (
            key &&
            key.startsWith("bookmark_")
        ) {

            count++;

        }

    }


    bookmarkCount.textContent =
        count;

}



/* =========================================
   LOGOUT
========================================= */

document
    .getElementById("profileLogoutBtn")
    .addEventListener(
        "click",
        async function () {

            const confirmed =
                confirm(
                    "Are you sure you want to logout?"
                );


            if (!confirmed) {
                return;
            }


            try {

                await signOut(auth);


                localStorage.removeItem(
                    "uniqueAcademicUser"
                );

                localStorage.removeItem(
                    "studentLoggedIn"
                );

                sessionStorage.clear();


                window.location.href =
                    "student-login.html";

            }

            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );


                profileMessage.textContent =
                    "❌ Unable to logout. Please try again.";

                profileMessage.className =
                    "profileMessage error";

            }

        }
    );

</script>


</body>

</html>

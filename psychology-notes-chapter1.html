<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        🧠 Psychology Chapter 1 | Unique Academic
    </title>


    <style>

        /* =================================================
           UNIQUE ACADEMIC
           PSYCHOLOGY CHAPTER 1 NOTES
        ================================================= */


        /* =================================================
           ROOT
        ================================================= */

        :root {

            --bg-color: #f3f4f6;

            --card-bg: #ffffff;

            --text-main: #1f2937;

            --text-muted: #4b5563;

            --primary-purple: #64229b;

            --primary-dark: #4c1d7a;

            --accent-green: #047857;

            --accent-orange: #c2410c;

            --accent-blue: #1d4ed8;

            --border-color: #ded7e6;


            --shadow:
                0 4px 12px rgba(0, 0, 0, 0.08),
                0 2px 5px rgba(0, 0, 0, 0.04);

        }



        /* =================================================
           RESET
        ================================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }



        html {

            scroll-behavior: smooth;

        }



        body {

            font-family:

                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;


            background:
                linear-gradient(
                    180deg,
                    #f5f5f6 0%,
                    #eef0f4 100%
                );


            color: var(--text-main);

            line-height: 1.7;

            padding: 18px;

            max-width: 700px;

            margin: 0 auto;

            min-height: 100vh;

        }



        /* =================================================
           TOP NAVIGATION
        ================================================= */

        .top-navigation {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 16px;

            margin-bottom: 34px;

        }



        .nav-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            min-height: 58px;

            padding: 0 26px;

            border-radius: 20px;

            font-size: 1.1rem;

            font-weight: 800;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }



        .nav-button:active {

            transform: scale(0.96);

        }



        /* =================================================
           BACK BUTTON
        ================================================= */

        .back-button {

            background:
                linear-gradient(
                    135deg,
                    #6f2aa8,
                    #54208a
                );

            color: white;

            box-shadow:
                0 5px 12px rgba(91, 32, 145, 0.22);

        }



        /* =================================================
           HOME BUTTON
        ================================================= */

        .home-button {

            background: white;

            color: var(--primary-purple);

            border: 1px solid #dedede;

            box-shadow: var(--shadow);

        }



        /* =================================================
           CHAPTER HEADER
        ================================================= */

        .page-header {

            background:
                linear-gradient(
                    135deg,
                    #6a2aa0 0%,
                    #4b1d78 100%
                );

            color: white;

            padding: 48px 20px;

            border-radius: 30px;

            margin-bottom: 30px;

            text-align: center;

            box-shadow:
                0 8px 18px rgba(78, 27, 126, 0.18);

        }



        .page-header h1 {

            font-size: 2rem;

            font-weight: 800;

            margin-bottom: 12px;

            letter-spacing: -0.5px;

            line-height: 1.3;

        }



        .page-header p {

            color: rgba(255, 255, 255, 0.88);

            font-size: 1.1rem;

            font-weight: 500;

        }



        /* =================================================
           NOTE CARD

           GEMINI'S REAL NOTE CONTENT CAN USE THIS CLASS
        ================================================= */

        .note-card {

            background: var(--card-bg);

            border-radius: 18px;

            padding: 24px;

            margin-bottom: 20px;

            border: 1px solid var(--border-color);

            box-shadow: var(--shadow);

        }



        /* =================================================
           HEADINGS
        ================================================= */

        .note-card h1 {

            color: var(--primary-purple);

            font-size: 1.6rem;

            margin-bottom: 16px;

            line-height: 1.4;

        }



        .note-card h2 {

            color: var(--primary-purple);

            font-size: 1.35rem;

            margin-bottom: 16px;

            line-height: 1.45;

        }



        .note-card h3 {

            color: #303947;

            font-size: 1.15rem;

            margin:

                18px 0 12px;

            line-height: 1.5;

        }



        .note-card h4 {

            color: #303947;

            font-size: 1.05rem;

            margin:

                16px 0 10px;

        }



        /* =================================================
           TEXT
        ================================================= */

        .note-card p {

            color: var(--text-main);

            font-size: 1rem;

            margin-bottom: 16px;

            line-height: 1.8;

        }



        /* =================================================
           LISTS
        ================================================= */

        .note-card ul,

        .note-card ol {

            padding-left: 28px;

            margin:

                12px 0 18px;

            color: var(--text-main);

        }



        .note-card li {

            margin-bottom: 9px;

            padding-left: 3px;

        }



        /* =================================================
           HIGHLIGHT COLORS

           YOU OR GEMINI CAN USE:

           class="highlight-purple"
           class="highlight-green"
           class="highlight-orange"
           class="highlight-blue"
        ================================================= */

        .highlight-purple {

            color: var(--primary-purple);

            font-weight: 700;

        }



        .highlight-green {

            color: var(--accent-green);

            font-weight: 700;

        }



        .highlight-orange {

            color: var(--accent-orange);

            font-weight: 700;

        }



        .highlight-blue {

            color: var(--accent-blue);

            font-weight: 700;

        }



        /* =================================================
           EXAMPLE BOX
        ================================================= */

        .example-box {

            background: #fffaf0;

            border-left: 4px solid #f59e0b;

            padding: 16px;

            border-radius: 0 12px 12px 0;

            margin:

                18px 0;

            color: var(--text-main);

            line-height: 1.8;

        }



        /* =================================================
           IMPORTANT BOX
        ================================================= */

        .important-box {

            background: #eff6ff;

            border-left: 4px solid var(--accent-blue);

            padding: 16px;

            border-radius: 0 12px 12px 0;

            margin:

                18px 0;

            color: var(--text-main);

            line-height: 1.8;

        }



        /* =================================================
           AMHARIC NOTE BOX
        ================================================= */

        .amharic {

            background: #faf5ff;

            border-left: 4px solid var(--primary-purple);

            border-radius: 0 12px 12px 0;

            padding: 16px;

            margin-top: 18px;

            color: var(--text-main);

            line-height: 1.9;

        }



        .amharic-title {

            display: block;

            color: var(--primary-purple);

            font-size: 1rem;

            font-weight: 800;

            margin-bottom: 8px;

        }



        /* =================================================
           TABLE
        ================================================= */

        .table-responsive {

            overflow-x: auto;

            margin: 18px 0;

        }



        table {

            width: 100%;

            min-width: 550px;

            border-collapse: collapse;

            font-size: 0.92rem;

        }



        th,

        td {

            padding: 12px;

            border: 1px solid var(--border-color);

            text-align: left;

        }



        th {

            background: #f3e8ff;

            color: var(--primary-purple);

            font-weight: 800;

        }



        tr:nth-child(even) {

            background: #fafafa;

        }



        /* =================================================
           IMAGE / DIAGRAM
        ================================================= */

        .diagram-container {

            width: 100%;

            text-align: center;

            margin: 18px 0;

        }



        .diagram-container img {

            max-width: 100%;

            height: auto;

            border-radius: 14px;

            border: 1px solid var(--border-color);

        }



        /* =================================================
           BACK TO CHAPTERS
        ================================================= */

        .back-to-chapters {

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            background: white;

            color: var(--primary-purple);

            border: 1px solid var(--border-color);

            border-radius: 18px;

            min-height: 58px;

            padding: 0 24px;

            font-size: 1rem;

            font-weight: 800;

            margin: 30px auto;

            width: fit-content;

            box-shadow: var(--shadow);

            transition: transform 0.2s ease;

        }



        .back-to-chapters:active {

            transform: scale(0.96);

        }



        /* =================================================
           FOOTER
        ================================================= */

        .footer {

            text-align: center;

            padding: 20px 10px 35px;

            color: var(--text-muted);

            font-size: 0.9rem;

            line-height: 1.8;

        }



        /* =================================================
           MOBILE RESPONSIVE
        ================================================= */

        @media (max-width: 480px) {


            body {

                padding: 18px;

            }



            .top-navigation {

                margin-bottom: 30px;

            }



            .nav-button {

                min-height: 56px;

                padding: 0 20px;

                border-radius: 18px;

                font-size: 1rem;

            }



            .page-header {

                padding: 42px 18px;

                border-radius: 28px;

            }



            .page-header h1 {

                font-size: 1.75rem;

            }



            .page-header p {

                font-size: 1rem;

            }



            .note-card {

                padding: 20px 16px;

                border-radius: 16px;

            }



            .note-card h1 {

                font-size: 1.4rem;

            }



            .note-card h2 {

                font-size: 1.2rem;

            }



            .note-card h3 {

                font-size: 1.08rem;

            }



            .note-card p {

                font-size: 0.98rem;

            }



            .example-box,

            .important-box,

            .amharic {

                padding: 14px;

            }

        }



        /* =================================================
           SMALL MOBILE
        ================================================= */

        @media (max-width: 380px) {


            body {

                padding: 12px;

            }



            .nav-button {

                padding: 0 16px;

                font-size: 0.95rem;

            }



            .page-header h1 {

                font-size: 1.55rem;

            }



            .note-card {

                padding: 18px 14px;

            }

        }

    </style>

</head>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Unique Academic Administrator Panel"
    >

    <title>Admin Panel | Unique Academic</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #111827;
            min-height: 100vh;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }


        header h1 {
            font-size: 22px;
            line-height: 1.3;
        }


        .logout-btn {
            border: none;
            background: white;
            color: #2563eb;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }


        .logout-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }


        /* =========================================
           STATISTICS
        ========================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }


        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }


        .stat-card h3 {
            color: #64748b;
            margin-bottom: 10px;
            font-size: 15px;
        }


        .stat-card strong {
            font-size: 28px;
        }


        /* =========================================
           REGISTRATIONS CONTAINER
        ========================================= */

        .registrations {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }


        .registrations h2 {
            margin-bottom: 20px;
        }


        /* =========================================
           STUDENT CARD
        ========================================= */

        .student-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            background: #ffffff;
            transition: 0.2s;
        }


        .student-card:hover {
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }


        .student-card h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }


        .student-info {
            color: #475569;
            line-height: 1.8;
            margin-bottom: 14px;
            word-break: break-word;
        }


        .student-info strong {
            color: #111827;
        }


        /* =========================================
           PAYMENT INFORMATION
        ========================================= */

        .payment-info {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }


        .payment-info-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #1e293b;
        }


        .payment-info p {
            color: #475569;
            line-height: 1.7;
            margin-bottom: 5px;
        }


        .payment-info strong {
            color: #111827;
        }


        /* =========================================
           SCREENSHOT AREA
        ========================================= */

        .screenshot-section {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #dbeafe;
            background: #eff6ff;
        }


        .screenshot-section h4 {
            margin-bottom: 10px;
            color: #1e3a8a;
        }


        .screenshot-preview {
            display: none;
            width: 100%;
            max-width: 420px;
            max-height: 600px;
            object-fit: contain;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: white;
            cursor: pointer;
        }


        .view-screenshot-btn {
            display: inline-block;
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }


        .view-screenshot-btn:hover {
            background: #1d4ed8;
        }


        .no-screenshot {
            color: #64748b;
            font-size: 14px;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }


        .pending {
            background: #fef3c7;
            color: #92400e;
        }


        .approved {
            background: #dcfce7;
            color: #166534;
        }


        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }


        .actions button {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }


        .approve-btn {
            background: #16a34a;
        }


        .approve-btn:hover {
            background: #15803d;
        }


        .reject-btn {
            background: #dc2626;
        }


        .reject-btn:hover {
            background: #b91c1c;
        }


        .actions button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }


        /* =========================================
           REJECTION REASON
        ========================================= */

        .rejection-box {
            margin-top: 12px;
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
        }


        .rejection-box strong {
            display: block;
            margin-bottom: 5px;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }


        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }


        .empty-state-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }


        .empty-state h3 {
            color: #334155;
            margin-bottom: 8px;
        }


        /* =========================================
           IMAGE MODAL
        ========================================= */

        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            align-items: center;
            justify-content: center;
        }


        .image-modal.active {
            display: flex;
        }


        .modal-content {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .modal-image {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
            background: white;
        }


        .close-modal {
            position: absolute;
            top: -45px;
            right: 0;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: white;
            color: #111827;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }


            .container {
                margin-top: 18px;
            }

        }


        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }


            header {
                flex-direction: column;
                text-align: center;
            }


            header h1 {
                font-size: 19px;
            }


            .registrations {
                padding: 15px;
            }


            .student-card {
                padding: 15px;
            }


            .actions {
                flex-direction: column;
            }


            .actions button {
                width: 100%;
            }


            .screenshot-preview {
                max-width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1>
        👨‍💼 Unique Academic Admin
    </h1>


    <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
    >
        🚪 Logout
    </button>

</header>



<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container">


    <!-- =====================================
         STATISTICS
    ====================================== -->

    <div class="stats">


        <!-- TOTAL -->

        <div class="stat-card">

            <h3>
                👥 Total Students
            </h3>

            <strong id="totalCount">
                0
            </strong>

        </div>



        <!-- PENDING -->

        <div class="stat-card">

            <h3>
                ⏳ Pending
            </h3>

            <strong id="pendingCount">
                0
            </strong>

        </div>



        <!-- APPROVED -->

        <div class="stat-card">

            <h3>
                ✅ Approved
            </h3>

            <strong id="approvedCount">
                0
            </strong>

        </div>



        <!-- REJECTED -->

        <div class="stat-card">

            <h3>
                ❌ Rejected
            </h3>

            <strong id="rejectedCount">
                0
            </strong>

        </div>

    </div>



    <!-- =====================================
         REGISTRATION LIST
    ====================================== -->

    <div class="registrations">

        <h2>
            📝 Student Registrations
        </h2>


        <div id="registrationList">

            <div class="loading">

                ⏳ Loading registrations...

            </div>

        </div>

    </div>

</div>



<!-- =========================================
     PAYMENT SCREENSHOT MODAL
========================================= -->

<div
    id="imageModal"
    class="image-modal"
    aria-hidden="true"
>

    <div class="modal-content">

        <button
            id="closeModal"
            class="close-modal"
            type="button"
            aria-label="Close screenshot"
        >
            ✕
        </button>


        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt="Student payment screenshot"
        >

    </div>

</div>



<!-- =========================================
     ADMIN JAVASCRIPT
========================================= -->

<script
    type="module"
    src="admin.js"
></script>


<script>

    /*
    ========================================
    PAYMENT SCREENSHOT MODAL
    ========================================
    */

    const imageModal =
        document.getElementById("imageModal");

    const modalImage =
        document.getElementById("modalImage");

    const closeModal =
        document.getElementById("closeModal");


    window.openScreenshot = function (imageUrl) {

        if (!imageUrl) {
            return;
        }

        modalImage.src = imageUrl;

        imageModal.classList.add("active");

        imageModal.setAttribute(
            "aria-hidden",
            "false"
        );

    };


    function closeScreenshotModal() {

        imageModal.classList.remove("active");

        imageModal.setAttribute(
            "aria-hidden",
            "true"
        );

        modalImage.src = "";

    }


    closeModal.addEventListener(
        "click",
        closeScreenshotModal
    );


    imageModal.addEventListener(
        "click",
        function (event) {

            if (event.target === imageModal) {

                closeScreenshotModal();

            }

        }
    );


    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Escape") {

                closeScreenshotModal();

            }

        }
    );

</script>


</body>

</html>

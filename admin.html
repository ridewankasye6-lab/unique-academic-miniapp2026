<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Unique Academic</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 22px;
        }

        .logout-btn {
            border: none;
            background: white;
            color: #2563eb;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-card h3 {
            color: #64748b;
            margin-bottom: 10px;
        }

        .stat-card strong {
            font-size: 28px;
        }

        .registrations {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .registrations h2 {
            margin-bottom: 20px;
        }

        .student-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .student-card h3 {
            margin-bottom: 8px;
        }

        .student-info {
            color: #475569;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions button {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .approve-btn {
            background: #16a34a;
        }

        .reject-btn {
            background: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                text-align: center;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>👨‍💼 Unique Academic Admin</h1>

    <button id="logoutBtn"
            class="logout-btn">
        🚪 Logout
    </button>

</header>


<div class="container">

    <div class="stats">

        <div class="stat-card">
            <h3>👥 Total</h3>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat-card">
            <h3>⏳ Pending</h3>
            <strong id="pendingCount">0</strong>
        </div>

        <div class="stat-card">
            <h3>✅ Approved</h3>
            <strong id="approvedCount">0</strong>
        </div>

    </div>


    <div class="registrations">

        <h2>📝 Student Registrations</h2>

        <div id="registrationList">

            <div class="loading">
                ⏳ Loading registrations...
            </div>

        </div>

    </div>

</div>


<script type="module" src="admin.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unique Academic — Admin Verification</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .title {
      margin-bottom: 20px;
    }

    .title h2 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .title p {
      color: #64748b;
    }

    .status-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .status-card h3 {
      margin-bottom: 15px;
    }

    .student-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .student-header h3 {
      font-size: 20px;
    }

    .pending {
      background: #fff7ed;
      color: #c2410c;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .approved {
      background: #dcfce7;
      color: #15803d;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .rejected {
      background: #fee2e2;
      color: #b91c1c;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .info {
      background: #f8fafc;
      padding: 14px;
      border-radius: 9px;
    }

    .info strong {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .info span {
      font-size: 15px;
      word-break: break-word;
    }

    .payment {
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
      margin-top: 10px;
    }

    .payment h4 {
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 50px 20px;
      border-radius: 14px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      background: white;
      padding: 40px 20px;
      border-radius: 14px;
      color: #64748b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 650px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .student-card {
        padding: 16px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <h1>🎓 Unique Academic</h1>
  <p>Admin Verification Panel</p>
</header>

<main class="container">

  <div class="title">
    <h2>🔐 Registration Verification</h2>
    <p>Review real student registration and payment information.</p>
  </div>

  <div class="status-card">
    <h3>📊 Verification Summary</h3>
    <p>
      Pending registrations:
      <strong id="pendingCount">0</strong>
    </p>
  </div>

  <div id="registrationsContainer">

    <div class="loading">
      ⏳ Loading registrations...
    </div>

  </div>

</main>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  db
} from "./firebase-config.js";

import {
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================
   ELEMENTS
========================================= */

const container =
  document.getElementById("registrationsContainer");

const pendingCount =
  document.getElementById("pendingCount");


/* =========================================
   LOAD REAL REGISTRATIONS
========================================= */

const registrationsQuery =
  query(
    collection(db, "registrations"),
    orderBy("submittedAt", "desc")
  );


onSnapshot(
  registrationsQuery,

  (snapshot) => {

    container.innerHTML = "";

    let pending = 0;


    if (snapshot.empty) {

      container.innerHTML = `
        <div class="empty">
          <h3>📭 No registrations yet</h3>
          <p>New student registrations will appear here.</p>
        </div>
      `;

      pendingCount.textContent = "0";

      return;
    }


    snapshot.forEach((registrationDoc) => {

      const data =
        registrationDoc.data();

      const registrationId =
        registrationDoc.id;


      if (data.status === "pending") {
        pending++;
      }


      const card =
        createRegistrationCard(
          registrationId,
          data
        );


      container.appendChild(card);

    });


    pendingCount.textContent =
      pending;

  },

  (error) => {

    console.error(
      "Firestore error:",
      error
    );

    container.innerHTML = `
      <div class="error">
        <strong>⚠️ Could not load registrations.</strong>
        <p>
          Please check your Firestore security rules
          and Firebase configuration.
        </p>
      </div>
    `;

  }
);


/* =========================================
   CREATE REGISTRATION CARD
========================================= */

function createRegistrationCard(
  id,
  data
) {

  const card =
    document.createElement("div");

  card.className =
    "student-card";


  const status =
    data.status || "pending";


  let statusClass =
    "pending";


  if (status === "approved") {
    statusClass = "approved";
  }

  if (status === "rejected") {
    statusClass = "rejected";
  }


  card.innerHTML = `

    <div class="student-header">

      <h3>
        👤 ${escapeHTML(
          data.fullName || "Unknown Student"
        )}
      </h3>

      <span class="${statusClass}">
        ${status.toUpperCase()}
      </span>

    </div>


    <div class="info-grid">

      <div class="info">
        <strong>Full Name</strong>
        <span>
          ${escapeHTML(
            data.fullName || "—"
          )}
        </span>
      </div>


      <div class="info">
        <strong>Phone</strong>
        <span>
          ${escapeHTML(
            data.phone || "—"
          )}
        </span>
      </div>


      <div class="info">
        <strong>Email</strong>
        <span>
          ${escapeHTML(
            data.email || "—"
          )}
        </span>
      </div>


      <div class="info">
        <strong>University</strong>
        <span>
          ${escapeHTML(
            data.university || "—"
          )}
        </span>
      </div>


      <div class="info">
        <strong>Department</strong>
        <span>
          ${escapeHTML(
            data.department || "—"
          )}
        </span>
      </div>


      <div class="info">
        <strong>User ID</strong>
        <span>
          ${escapeHTML(
            data.userId || "—"
          )}
        </span>
      </div>

    </div>


    <div class="payment">

      <h4>💰 Payment Information</h4>


      <div class="info-grid">

        <div class="info">
          <strong>Amount</strong>
          <span>
            ${data.amount || 300}
            ${escapeHTML(
              data.currency || "ETB"
            )}
          </span>
        </div>


        <div class="info">
          <strong>Payment Method</strong>
          <span>
            ${escapeHTML(
              data.paymentMethod || "—"
            )}
          </span>
        </div>


        <div class="info">
          <strong>Transaction Reference</strong>
          <span>
            ${escapeHTML(
              data.paymentReference || "—"
            )}
          </span>
        </div>


        <div class="info">
          <strong>Payment Recipient</strong>
          <span>
            Rediwan Kassiye
          </span>
        </div>

      </div>


      ${
        status === "pending"
        ? `

          <div class="buttons">

            <button
              class="approve"
              data-action="approve"
              data-id="${id}">
              ✅ Approve
            </button>


            <button
              class="reject"
              data-action="reject"
              data-id="${id}">
              ❌ Reject
            </button>

          </div>

        `
        : ""
      }

    </div>

  `;


  /* =========================================
     APPROVE
  ========================================= */

  const approveButton =
    card.querySelector(
      '[data-action="approve"]'
    );


  if (approveButton) {

    approveButton.addEventListener(
      "click",
      () => approveRegistration(id)
    );

  }


  /* =========================================
     REJECT
  ========================================= */

  const rejectButton =
    card.querySelector(
      '[data-action="reject"]'
    );


  if (rejectButton) {

    rejectButton.addEventListener(
      "click",
      () => rejectRegistration(id)
    );

  }


  return card;
}


/* =========================================
   APPROVE REGISTRATION
========================================= */

async function approveRegistration(id) {

  const confirmed =
    confirm(
      "Are you sure you want to APPROVE this registration?"
    );


  if (!confirmed) {
    return;
  }


  try {

    await updateDoc(
      doc(
        db,
        "registrations",
        id
      ),

      {
        status: "approved",
        reviewedAt: new Date()
      }
    );


    alert(
      "✅ Registration approved successfully."
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "❌ Could not approve this registration."
    );

  }

}


/* =========================================
   REJECT REGISTRATION
========================================= */

async function rejectRegistration(id) {

  const reason =
    prompt(
      "Please enter the reason for rejecting this registration:"
    );


  if (!reason) {
    return;
  }


  try {

    await updateDoc(
      doc(
        db,
        "registrations",
        id
      ),

      {
        status: "rejected",
        rejectionReason: reason,
        reviewedAt: new Date()
      }
    );


    alert(
      "❌ Registration rejected."
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Could not reject this registration."
    );

  }

}


/* =========================================
   SECURITY
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>

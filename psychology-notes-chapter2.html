    <style>

        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;

            --primary-purple: #6b21a8;
            --primary-dark: #4c1d95;

            --accent-green: #047857;
            --accent-orange: #c2410c;
            --accent-blue: #1d4ed8;

            --border-color: #e5e7eb;

            --shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;

            padding: 12px;
            max-width: 680px;
            margin: 0 auto;
        }


        .page-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 16px;
            gap: 10px;
        }


        .page-navigation a {
            text-decoration: none;

            border-radius: 12px;

            padding: 10px 16px;

            font-size: 15px;
            font-weight: 700;

            box-shadow: var(--shadow);

            transition: 0.2s ease;
        }


        .page-navigation a:active {
            transform: scale(0.96);
        }


        .back-btn {
            background-color: var(--primary-purple);
            color: white;
        }


        .home-btn {
            background-color: white;
            color: var(--primary-purple);
            border: 1px solid var(--border-color);
        }


        header {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-purple),
                    var(--primary-dark)
                );

            color: white;

            padding: 20px 16px;

            border-radius: 16px;

            margin-bottom: 16px;

            text-align: center;

            box-shadow: var(--shadow);
        }


        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }


        header p {
            font-size: 0.9rem;
            opacity: 0.9;
            color: white;
        }


        .card {
            background-color: var(--card-bg);

            border-radius: 16px;

            padding: 18px 16px;

            margin-bottom: 16px;

            border: 1px solid var(--border-color);

            box-shadow: var(--shadow);
        }


        h2 {
            font-size: 1.2rem;

            color: var(--primary-purple);

            margin-bottom: 12px;

            border-bottom: 2px solid #f3e8ff;

            padding-bottom: 6px;
        }


        h3 {
            font-size: 1.05rem;
            color: var(--text-main);
            margin: 12px 0 8px;
        }


        p {
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }


        ul,
        ol {
            margin-bottom: 12px;
            padding-left: 20px;

            color: var(--text-muted);

            font-size: 0.95rem;
        }


        li {
            margin-bottom: 6px;
        }


        .highlight-green {
            color: var(--accent-green);
            font-weight: 600;
        }


        .highlight-orange {
            color: var(--accent-orange);
            font-weight: 600;
        }


        .highlight-blue {
            color: var(--accent-blue);
            font-weight: 600;
        }


        .highlight-purple {
            color: var(--primary-purple);
            font-weight: 600;
        }


        .example-box {
            background-color: #f9fafb;

            border-left: 4px solid #f59e0b;

            padding: 10px 12px;

            border-radius: 0 8px 8px 0;

            margin: 10px 0;

            font-size: 0.9rem;

            color: var(--text-main);
        }


        .case-box {
            background-color: #eff6ff;

            border-left: 4px solid var(--accent-blue);

            padding: 10px 12px;

            border-radius: 0 8px 8px 0;

            margin: 10px 0;

            font-size: 0.9rem;
        }


        .diagram-container {
            width: 100%;
            text-align: center;
            margin: 14px 0;
        }


        .diagram-container img {
            max-width: 100%;
            height: auto;

            border-radius: 12px;

            border: 1px solid var(--border-color);
        }


        .table-responsive {
            overflow-x: auto;
            margin: 12px 0;
        }


        table {
            width: 100%;
            border-collapse: collapse;

            font-size: 0.85rem;

            text-align: left;
        }


        th,
        td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
        }


        th {
            background-color: #f3e8ff;
            color: var(--primary-purple);
            font-weight: 600;
        }


        tr:nth-child(even) {
            background-color: #f9fafb;
        }


        .footer {
            text-align: center;

            padding: 25px 10px;

            color: var(--text-muted);

            font-size: 0.82rem;
        }

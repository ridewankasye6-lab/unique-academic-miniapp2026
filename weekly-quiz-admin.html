<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>👑 Weekly Quiz Admin — Unique Academic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .hero {
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            padding: 28px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .hero p {
            margin: 6px 0;
        }

        .brand {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 15px;
        }

        .panel {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }

        .status {
            text-align: center;
            font-weight: bold;
            color: #1976d2;
        }

        .question-card {
            border: 1px solid #e1e7ef;
            border-radius: 15px;
            padding: 18px;
            margin-top: 15px;
            background: #fbfcfe;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .question-number {
            font-weight: bold;
            color: #1976d2;
        }

        .answer-label {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        .question-text {
            font-size: 17px;
            line-height: 1.5;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            padding: 10px 12px;
            margin: 7px 0;
            border-radius: 9px;
            background: white;
            border: 1px solid #e2e7ee;
            line-height: 1.4;
        }

        .option.correct {
            border: 2px solid #2e7d32;
            background: #edf8ee;
            font-weight: bold;
        }

        .explanation {
            margin-top: 14px;
            padding: 12px;
            background: #fff8e1;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
        }

        .hint {
            margin-top: 10px;
            padding: 12px;
            background: #eef6ff;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background: #1976d2;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin: 25px 0 10px;
            color: #667085;
            font-size: 13px;
        }

        .error {
            color: #c62828;
            text-align: center;
            line-height: 1.5;
        }

        body.dark-mode {
            background: #111;
            color: white;
        }

        body.dark-mode .panel,
        body.dark-mode .question-card,
        body.dark-mode .option {
            background: #1d1d1d;
            color: white;
        }

        body.dark-mode .question-card,
        body.dark-mode .option {
            border-color: #333;
        }

        body.dark-mode .explanation {
            background: #332d18;
        }

        body.dark-mode .hint {
            background: #17283a;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .panel {
                padding: 16px;
            }

            .hero h1 {
                font-size: 23px;
            }

            .question-header {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- =================================================
         HERO
    ================================================= -->

    <div class="hero">

        <h1>
            👑 Weekly Quiz Admin
        </h1>

        <p>
            Manage & Preview Weekly Academic Challenge
        </p>

        <div class="brand">
            🎓 Unique Academic
        </div>

    </div>


    <!-- =================================================
         STATUS
    ================================================= -->

    <div class="panel">

        <div
            id="status"
            class="status"
        >
            ⏳ Loading questions...
        </div>

    </div>


    <!-- =================================================
         QUESTIONS
    ================================================= -->

    <div
        id="questionsContainer"
        class="panel"
    ></div>


    <!-- =================================================
         FOOTER
    ================================================= -->

    <div class="footer">

        <a
            href="index.html"
            class="home-btn"
        >
            🏠 Back Home
        </a>

        <p>
            Learn. Understand. Succeed.
        </p>

        <p>
            © Unique Academic
        </p>

    </div>

</div>


<script>

/* =====================================================
   ADMIN QUESTION VIEWER
=====================================================

   This page reads the weeklyQuestions array from:

   weekly-quiz.html

   Your existing Weekly Quiz page is NOT changed.

===================================================== */


/* =====================================================
   LOAD QUESTIONS
===================================================== */

async function loadQuestions() {

    const status =
        document.getElementById("status");

    const container =
        document.getElementById(
            "questionsContainer"
        );


    try {

        const response =
            await fetch(
                "weekly-quiz.html"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load weekly-quiz.html"
            );

        }


        const html =
            await response.text();


        /* =============================================
           FIND weeklyQuestions ARRAY
        ============================================= */

        const startText =
            "const weeklyQuestions =";


        const startIndex =
            html.indexOf(startText);


        if (startIndex === -1) {

            throw new Error(
                "weeklyQuestions was not found."
            );

        }


        const arrayStart =
            html.indexOf(
                "[",
                startIndex
            );


        const arrayEnd =
            html.indexOf(
                "];",
                arrayStart
            );


        if (
            arrayStart === -1 ||
            arrayEnd === -1
        ) {

            throw new Error(
                "Could not read the question list."
            );

        }


        const arrayCode =
            html.substring(
                arrayStart,
                arrayEnd + 1
            );


        /* =============================================
           READ THE QUESTION ARRAY
        ============================================= */

        const questions =
            Function(
                '"use strict"; return (' +
                arrayCode +
                ')'
            )();


        displayQuestions(
            questions
        );


    } catch (error) {

        console.error(error);


        status.textContent =
            "❌ Could not load the weekly questions.";


        status.classList.add(
            "error"
        );


        container.innerHTML =

            '<div class="error">' +

            '<b>Something went wrong.</b><br><br>' +

            'Make sure these two files are in the same folder:<br><br>' +

            '<b>weekly-quiz.html</b><br>' +

            '<b>weekly-quiz-admin.html</b><br><br>' +

            'Then refresh this page.' +

            '</div>';

    }

}


/* =====================================================
   DISPLAY QUESTIONS
===================================================== */

function displayQuestions(
    questions
) {

    const status =
        document.getElementById(
            "status"
        );


    const container =
        document.getElementById(
            "questionsContainer"
        );


    status.textContent =
        "✅ " +
        questions.length +
        " questions loaded successfully";


    container.innerHTML = "";


    questions.forEach(
        function (
            question,
            questionIndex
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "question-card";


            /* =========================================
               HEADER
            ========================================= */

            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "question-header";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "question-number";


            number.textContent =
                "Question " +
                (questionIndex + 1);


            const answer =
                document.createElement(
                    "div"
                );


            answer.className =
                "answer-label";


            answer.textContent =
                "Correct: " +
                String.fromCharCode(
                    65 + question.answer
                );


            header.appendChild(
                number
            );


            header.appendChild(
                answer
            );


            card.appendChild(
                header
            );


            /* =========================================
               QUESTION TEXT
            ========================================= */

            const questionText =
                document.createElement(
                    "div"
                );


            questionText.className =
                "question-text";


            questionText.textContent =
                question.question;


            card.appendChild(
                questionText
            );


            /* =========================================
               OPTIONS
            ========================================= */

            question.options.forEach(
                function (
                    option,
                    optionIndex
                ) {

                    const optionElement =
                        document.createElement(
                            "div"
                        );


                    optionElement.className =
                        "option";


                    if (
                        optionIndex ===
                        question.answer
                    ) {

                        optionElement.classList.add(
                            "correct"
                        );

                    }


                    optionElement.textContent =

                        String.fromCharCode(
                            65 + optionIndex
                        ) +

                        ". " +

                        option;


                    card.appendChild(
                        optionElement
                    );

                }
            );


            /* =========================================
               EXPLANATION
            ========================================= */

            const explanation =
                document.createElement(
                    "div"
                );


            explanation.className =
                "explanation";


            explanation.innerHTML =
                "<b>💡 Explanation:</b><br>" +
                escapeHTML(
                    question.explanation
                );


            card.appendChild(
                explanation
            );


            /* =========================================
               HINT
            ========================================= */

            const hint =
                document.createElement(
                    "div"
                );


            hint.className =
                "hint";


            hint.innerHTML =
                "<b>🔎 Hint:</b><br>" +
                escapeHTML(
                    question.hint
                );


            card.appendChild(
                hint
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   SAFE TEXT
===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


/* =====================================================
   DARK MODE
===================================================== */

if (
    localStorage.getItem(
        "darkMode"
    ) === "true"
) {

    document.body.classList.add(
        "dark-mode"
    );

}


/* =====================================================
   START
===================================================== */

loadQuestions();

</script>

</body>

</html>

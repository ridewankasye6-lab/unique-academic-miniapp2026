<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Unique Academic</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">🎓</div>

    <h1>Unique Academic</h1>

    <p class="subtitle">
      🔐 Admin Login
    </p>

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        🔐 Login to Admin Panel
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <a
      href="index.html"
      class="back"
    >
      ← Back to Home
    </a>

  </div>


  <script type="module">

    import {
      auth
    } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    const ADMIN_EMAIL =
      "ridewankasye6@gmail.com";


    const form =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (
          email.toLowerCase() !==
          ADMIN_EMAIL.toLowerCase()
        ) {

          showMessage(
            "❌ This email is not authorized as admin.",
            "error"
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "⏳ Logging in...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "✅ Login successful! Opening Admin Panel...",
            "success"
          );


          setTimeout(
            () => {
              window.location.href =
                "admin.html";
            },
            700
          );

        }

        catch (error) {

          console.error(error);

          showMessage(
            "❌ Login failed. Check your email and password.",
            "error"
          );

          loginButton.disabled =
            false;

          loginButton.textContent =
            "🔐 Login to Admin Panel";

        }

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student login for Unique Academic."
    >

    <title>Student Login | Unique Academic</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           LOGIN CONTAINER
        ========================================= */

        .login-container {

            min-height: 80vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;

        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

            box-sizing: border-box;

        }


        /* =========================================
           ICON
        ========================================= */

        .login-icon {

            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;

        }


        /* =========================================
           TITLE
        ========================================= */

        .login-card h1 {

            text-align: center;

            margin-bottom: 8px;

        }


        .login-subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 25px;

            line-height: 1.5;

        }


        /* =========================================
           LABELS
        ========================================= */

        .login-card label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }


        /* =========================================
           INPUTS
        ========================================= */

        .login-card input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px;

            margin-bottom: 18px;

            border:
                1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

        }


        .login-card input:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(
                    37,
                    99,
                    235,
                    0.10
                );

        }


        /* =========================================
           PASSWORD
        ========================================= */

        .password-wrapper {

            position: relative;

            width: 100%;

        }


        .password-wrapper input {

            padding-right: 55px;

        }


        .show-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            padding: 5px;

        }


        .show-password:focus {

            outline: none;

        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            transition:
                0.2s ease;

        }


        .login-button:hover {

            background: #1d4ed8;

        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* =========================================
           MESSAGE
        ========================================= */

        .login-message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 9px;

            text-align: center;

            line-height: 1.5;

        }


        .login-message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

        }


        .login-message.success {

            display: block;

            background: #dcfce7;

            color: #166534;

        }


        /* =========================================
           LINKS
        ========================================= */

        .login-links {

            text-align: center;

            margin-top: 20px;

        }


        .login-links p {

            margin: 10px 0;

        }


        .login-links a {

            color: #2563eb;

            text-decoration: none;

            font-weight: 600;

        }


        .login-links a:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1>
        🎓 Unique Academic
    </h1>

    <p>
        BDU Learning Platform
    </p>

</header>



<!-- =========================================
     LOGIN
========================================= -->

<main class="login-container">

    <section class="login-card">


        <div class="login-icon">
            👨‍🎓
        </div>


        <h1>
            Student Login
        </h1>


        <p class="login-subtitle">

            Login to access your
            Unique Academic account.

        </p>



        <!-- =====================================
             LOGIN FORM
        ====================================== -->

        <form
            id="studentLoginForm"
            novalidate
        >


            <!-- EMAIL -->

            <label for="email">

                Email Address

            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >



            <!-- PASSWORD -->

            <label for="password">

                Password

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    id="showPasswordBtn"
                    class="show-password"
                    aria-label="Show password"
                >

                    👁️

                </button>


            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >

                🔐 Login

            </button>


        </form>



        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
            id="loginMessage"
            class="login-message"
            role="alert"
            aria-live="polite"
        ></div>



        <!-- =====================================
             LINKS
        ====================================== -->

        <div class="login-links">


            <p>

                Don't have an account?

                <a href="registration.html">

                    Register

                </a>

            </p>


            <p>

                <a href="index.html">

                    🏠 Back Home

                </a>

            </p>


        </div>


    </section>

</main>



<!-- =========================================
     FIREBASE LOGIN SCRIPT
========================================= -->

<script type="module">


/* =========================================
   FIREBASE CONFIG

   IMPORTANT:
   We use the SAME auth instance
   from firebase-config.js
========================================= */

import {
    auth
} from "./firebase-config.js";


import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";



/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById(
        "studentLoginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const showPasswordBtn =
    document.getElementById(
        "showPasswordBtn"
    );



/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPasswordBtn.addEventListener(
    "click",
    function () {


        const isPassword =
            passwordInput.type ===
            "password";


        if (isPassword) {


            passwordInput.type =
                "text";


            showPasswordBtn.textContent =
                "🙈";


            showPasswordBtn.setAttribute(
                "aria-label",
                "Hide password"
            );


        }

        else {


            passwordInput.type =
                "password";


            showPasswordBtn.textContent =
                "👁️";


            showPasswordBtn.setAttribute(
                "aria-label",
                "Show password"
            );


        }

    }
);



/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    async function (event) {


        event.preventDefault();


        /* =================================
           GET VALUES
        ================================= */

        const email =
            emailInput.value
                .trim();


        const password =
            passwordInput.value;



        /* =================================
           BASIC VALIDATION
        ================================= */

        if (!email) {

            showMessage(
                "📧 Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if (!password) {

            showMessage(
                "🔐 Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }



        /* =================================
           START LOGIN
        ================================= */

        loginButton.disabled =
            true;


        loginButton.textContent =
            "⏳ Logging in...";


        hideMessage();



        try {


            /* =================================
               FIREBASE AUTHENTICATION
            ================================= */

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;



            /* =================================
               SAVE LOGIN STATE
               
               Compatibility with your
               existing Unique Academic system.
            ================================= */

            localStorage.setItem(
                "studentLoggedIn",
                "true"
            );


            localStorage.setItem(
                "uniqueAcademicUser",
                JSON.stringify({

                    uid:
                        user.uid,

                    email:
                        user.email,

                    displayName:
                        user.displayName ||
                        "Student"

                })
            );



            /* =================================
               SUCCESS
            ================================= */

            showMessage(
                "🎉 Login successful! Welcome back!",
                "success"
            );


            loginButton.textContent =
                "✅ Logged In";


            /* =================================
               GO HOME
            ================================= */

            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                700
            );


        }


        catch (error) {


            console.error(
                "Firebase Login Error:",
                error
            );


            /* =================================
               DEFAULT ERROR
            ================================= */

            let message =
                "❌ Incorrect email or password.";



            /* =================================
               FIREBASE ERROR HANDLING
            ================================= */

            switch (error.code) {


                case "auth/invalid-email":

                    message =
                        "📧 Please enter a valid email address.";

                    break;



                case "auth/user-not-found":

                    message =
                        "❌ No account was found with this email.";

                    break;



                case "auth/wrong-password":

                    message =
                        "❌ Incorrect password.";

                    break;



                case "auth/invalid-credential":

                    message =
                        "❌ Incorrect email or password.";

                    break;



                case "auth/too-many-requests":

                    message =
                        "⚠️ Too many login attempts. Please try again later.";

                    break;



                case "auth/user-disabled":

                    message =
                        "🚫 This account has been disabled.";

                    break;



                case "auth/network-request-failed":

                    message =
                        "🌐 Network error. Please check your internet connection.";

                    break;



                case "auth/operation-not-allowed":

                    message =
                        "⚠️ Email/password login is not enabled in Firebase Authentication.";

                    break;



                default:

                    message =
                        "❌ Login failed. Please try again.";

                    break;

            }



            /* =================================
               SHOW ERROR
            ================================= */

            showMessage(
                message,
                "error"
            );


            /* =================================
               RESET BUTTON
            ================================= */

            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 Login";

        }

    }
);



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    message,
    type
) {


    loginMessage.textContent =
        message;


    loginMessage.className =
        "login-message " +
        type;

}



/* =========================================
   HIDE MESSAGE
========================================= */

function hideMessage() {


    loginMessage.textContent =
        "";


    loginMessage.className =
        "login-message";

}


</script>


</body>

</html>

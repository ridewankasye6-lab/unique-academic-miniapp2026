<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Student Login | Unique Academic</title>

<link rel="stylesheet" href="style.css">

<style>

.login-container {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.login-icon {
    text-align: center;
    font-size: 50px;
    margin-bottom: 10px;
}

.login-card h1 {
    text-align: center;
    margin-bottom: 8px;
}

.login-subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.login-card label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.login-card input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
}

.login-card input:focus {
    outline: none;
    border-color: #2563eb;
}

.login-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.login-button:disabled {
    opacity: 0.6;
}

.login-message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 9px;
    text-align: center;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.login-links {
    text-align: center;
    margin-top: 20px;
}

.login-links a {
    color: #2563eb;
    text-decoration: none;
}

</style>

</head>

<body>

<header>

<h1>🎓 Unique Academic</h1>

<p>BDU Learning Platform</p>

</header>


<div class="login-container">

<div class="login-card">

<div class="login-icon">
👨‍🎓
</div>

<h1>Student Login</h1>

<p class="login-subtitle">
Login to access your Unique Academic account.
</p>


<form id="studentLoginForm">

<label for="email">
Email Address
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>


<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>


<button
    type="submit"
    id="loginButton"
    class="login-button"
>
🔐 Login
</button>

</form>


<div
    id="loginMessage"
    class="login-message"
></div>


<div class="login-links">

<p>
Don't have an account?
<a href="registration.html">
Register
</a>
</p>

<br>

<p>
<a href="index.html">
🏠 Back Home
</a>
</p>

</div>

</div>

</div>


<script type="module">

import { auth } from "./firebase-config.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const form =
    document.getElementById("studentLoginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        loginButton.disabled = true;

        loginButton.textContent =
            "⏳ Logging in...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            window.location.href =
                "index.html";

        }

        catch(error) {

            console.error(error);

            loginMessage.textContent =
                "❌ Incorrect email or password.";

            loginMessage.className =
                "login-message error";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "🔐 Login";

        }

    }
);

</script>

</body>

</html>

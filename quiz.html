<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#8e44ad"
    >

    <title>Unique Academic Quiz</title>

    <link
        rel="stylesheet"
        href="quiz.css"
    >

</head>


<body>

<div class="page">


    <!-- =====================================
         STICKY TOP HEADER
    ====================================== -->

    <header class="quizHeader">

        <button
            id="backBtn"
            class="topNavBtn backBtn"
            type="button"
            aria-label="Go back"
        >

            <span class="navIcon">
                ←
            </span>

            <span class="backText">
                Back
            </span>

        </button>


        <div class="headerTitle">

            <span class="headerBook">
                📖
            </span>

            <div>

                <h1 id="headerTitle">
                    Unique Academic
                </h1>

                <p id="headerChapter">
                    Quiz
                </p>

            </div>

        </div>


        <button
            id="homeBtn"
            class="topNavBtn homeBtn"
            type="button"
            aria-label="Go to home"
        >

            <span class="homeIcon">
                ⌂
            </span>

            <span class="homeText">
                Home
            </span>

        </button>

    </header>



    <!-- =====================================
         MAIN QUIZ CONTENT
    ====================================== -->

    <main
        class="quizContainer"
        id="quizContainer"
    >


        <!-- =====================================
             SUBJECT / CHAPTER
        ====================================== -->

        <section class="subjectCard">

            <div class="subjectIcon">
                🎓
            </div>

            <div class="subjectInfo">

                <p class="smallLabel">
                    CURRENT QUIZ
                </p>

                <h2 id="subjectName">
                    Subject
                </h2>

                <p id="chapterName">
                    Chapter 1
                </p>

            </div>

        </section>



        <!-- =====================================
             PROGRESS
        ====================================== -->

        <section class="progressCard">

            <div class="progressTop">

                <span>
                    Quiz Progress
                </span>

                <strong id="questionNumber">
                    Question 1 / 10
                </strong>

            </div>


            <div class="progressTrack">

                <div
                    id="progressBar"
                    class="progressBar"
                ></div>

            </div>

        </section>



        <!-- =====================================
             QUESTIONS
        ====================================== -->

        <div id="questionsPage"></div>



        <!-- =====================================
             BOTTOM QUESTION NAVIGATION
        ====================================== -->

        <div class="questionNavigation">

            <button
                id="previousQuestionBtn"
                class="questionNavBtn previousQuestionBtn"
                type="button"
            >

                <span class="navArrow">
                    ←
                </span>

                <span>
                    Previous
                </span>

            </button>


            <button
                id="nextBtn"
                class="questionNavBtn nextQuestionBtn"
                type="button"
            >

                <span>
                    Next
                </span>

                <span class="navArrow">
                    →
                </span>

            </button>

        </div>



        <!-- =====================================
             COMPLETION
        ====================================== -->

        <div
            id="completionMessage"
            class="completionMessage"
            hidden
        >

            <div class="completionIcon">
                🎉
            </div>

            <h2>
                Quiz Completed!
            </h2>

            <p>
                Great job! You have reached the end of this quiz.
            </p>

        </div>


    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="quizFooter">

        <p>
            🎓 Unique Academic
        </p>

        <span>
            Learn • Practice • Succeed
        </span>

    </footer>


</div>



<!-- =====================================================
     QUIZ DATA LOADER
     
     IMPORTANT ORDER:

     1. access-guard.js
     2. quizData.js
     3. additionalQuizData.js
     4. quiz.js

     quiz.js is NOT loaded until the data files finish.
===================================================== -->

<script type="module">

document.addEventListener(
    "uniqueAcademicAccessGranted",
    function () {

        console.log(
            "Unique Academic access granted."
        );


        // =================================================
        // PREVENT DOUBLE LOADING
        // =================================================

        if (
            window.uniqueAcademicQuizStarted === true
        ) {

            console.log(
                "Quiz system already started."
            );

            return;

        }


        window.uniqueAcademicQuizStarted =
            true;



        // =================================================
        // LOAD SCRIPT FUNCTION
        // =================================================

        function loadScript(
            src,
            required = true
        ) {

            return new Promise(
                function (
                    resolve,
                    reject
                ) {

                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =
                        src;


                    script.async =
                        false;


                    script.onload =
                        function () {

                            console.log(
                                "Loaded:",
                                src
                            );

                            resolve();

                        };


                    script.onerror =
                        function () {

                            console.error(
                                "FAILED TO LOAD:",
                                src
                            );


                            if (
                                required
                            ) {

                                reject(
                                    new Error(
                                        "Could not load " +
                                        src
                                    )
                                );

                            }

                            else {

                                resolve();

                            }

                        };


                    document.body.appendChild(
                        script
                    );

                }
            );

        }



        // =================================================
        // START QUIZ
        // =================================================

        async function startQuiz() {

            try {


                // =============================================
                // STEP 1
                // LOAD ORIGINAL QUIZ DATA
                // =============================================

                await loadScript(
                    "quizData.js",
                    true
                );


                console.log(
                    "quizData.js finished loading."
                );



                // =============================================
                // CHECK quizData
                // =============================================

                if (
                    typeof quizData ===
                    "undefined"
                ) {

                    throw new Error(
                        "quizData is not defined after quizData.js loaded."
                    );

                }


                console.log(
                    "quizData is available."
                );



                // =============================================
                // STEP 2
                // LOAD ADDITIONAL QUIZ DATA
                // =============================================

                await loadScript(
                    "additionalQuizData.js",
                    false
                );


                console.log(
                    "additionalQuizData.js finished loading."
                );



                // =============================================
                // GET URL PARAMETERS
                // =============================================

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const requestedSubject =
                    params.get(
                        "subject"
                    );


                const requestedChapter =
                    params.get(
                        "chapter"
                    );


                console.log(
                    "Requested subject:",
                    requestedSubject
                );


                console.log(
                    "Requested chapter:",
                    requestedChapter
                );



                // =============================================
                // CHECK URL
                // =============================================

                if (
                    !requestedSubject ||
                    !requestedChapter
                ) {

                    console.error(
                        "Quiz URL is missing subject or chapter."
                    );

                    return;

                }



                // =============================================
                // FIND SUBJECT
                // =============================================

                const subjectData =
                    quizData[
                        requestedSubject
                    ];


                if (
                    !subjectData
                ) {

                    console.error(
                        "Subject does not exist:",
                        requestedSubject
                    );


                    console.log(
                        "Available subjects:",
                        Object.keys(
                            quizData
                        )
                    );


                    return;

                }



                // =============================================
                // FIND CHAPTER
                // =============================================

                const chapterData =
                    subjectData[
                        requestedChapter
                    ];


                if (
                    !Array.isArray(
                        chapterData
                    ) ||
                    chapterData.length === 0
                ) {

                    console.error(
                        "No quiz questions found."
                    );


                    console.error(
                        "Subject:",
                        requestedSubject
                    );


                    console.error(
                        "Chapter:",
                        requestedChapter
                    );


                    console.log(
                        "Available chapters:",
                        Object.keys(
                            subjectData
                        )
                    );


                    return;

                }



                // =============================================
                // SUCCESSFUL DATA CHECK
                // =============================================

                console.log(
                    "================================="
                );


                console.log(
                    "QUIZ DATA FOUND"
                );


                console.log(
                    "Subject:",
                    requestedSubject
                );


                console.log(
                    "Chapter:",
                    requestedChapter
                );


                console.log(
                    "Number of questions:",
                    chapterData.length
                );


                console.log(
                    "================================="
                );



                // =============================================
                // STEP 3
                // LOAD QUIZ ENGINE LAST
                // =============================================

                await loadScript(
                    "quiz.js",
                    true
                );


                console.log(
                    "quiz.js loaded successfully."
                );


                console.log(
                    "Quiz engine started."
                );


            }

            catch (
                error
            ) {

                console.error(
                    "================================="
                );


                console.error(
                    "QUIZ START ERROR"
                );


                console.error(
                    error
                );


                console.error(
                    "================================="
                );

            }

        }



        // =================================================
        // START
        // =================================================

        startQuiz();

    }
);



</script>



<!-- =====================================================
     FIREBASE ACCESS CHECK

     This MUST remain AFTER the loader above.
===================================================== -->

<script
    type="module"
    src="access-guard.js"
></script>


</body>

</html>

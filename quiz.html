<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#8e44ad"
    >

    <title>Unique Academic Quiz</title>

    <link
        rel="stylesheet"
        href="quiz.css"
    >

</head>


<body>

<div class="page">

    <!-- =====================================
         STICKY TOP HEADER
    ====================================== -->

    <header class="quizHeader">

        <button
            id="backBtn"
            class="topNavBtn backBtn"
            type="button"
            aria-label="Go back"
        >
            <span class="navIcon">←</span>
            <span class="backText">Back</span>
        </button>


        <div class="headerTitle">

            <span class="headerBook">📖</span>

            <div>

                <h1 id="headerTitle">
                    Unique Academic
                </h1>

                <p id="headerChapter">
                    Quiz
                </p>

            </div>

        </div>


        <button
            id="homeBtn"
            class="topNavBtn homeBtn"
            type="button"
            aria-label="Go to home"
        >
            <span class="homeIcon">⌂</span>
            <span class="homeText">Home</span>
        </button>

    </header>


    <!-- =====================================
         MAIN QUIZ CONTENT
    ====================================== -->

    <main
        class="quizContainer"
        id="quizContainer"
    >

        <!-- Subject / Chapter -->

        <section class="subjectCard">

            <div class="subjectIcon">
                🎓
            </div>

            <div class="subjectInfo">

                <p class="smallLabel">
                    CURRENT QUIZ
                </p>

                <h2 id="subjectName">
                    Subject
                </h2>

                <p id="chapterName">
                    Chapter 1
                </p>

            </div>

        </section>


        <!-- Progress -->

        <section class="progressCard">

            <div class="progressTop">

                <span>
                    Quiz Progress
                </span>

                <strong id="questionNumber">
                    Question 1 / 10
                </strong>

            </div>


            <div class="progressTrack">

                <div
                    id="progressBar"
                    class="progressBar"
                ></div>

            </div>

        </section>


        <!-- =====================================
     QUESTIONS PAGE
====================================== -->

<div id="questionsPage"></div>


        <!-- =====================================
             BOTTOM QUESTION NAVIGATION
        ====================================== -->

        <div class="questionNavigation">

            <button
                id="previousQuestionBtn"
                class="questionNavBtn previousQuestionBtn"
                type="button"
            >

                <span class="navArrow">
                    ←
                </span>

                <span>
                    Previous
                </span>

            </button>


            <button
                id="nextBtn"
                class="questionNavBtn nextQuestionBtn"
                type="button"
            >

                <span>
                    Next
                </span>

                <span class="navArrow">
                    →
                </span>

            </button>

        </div>


        <!-- Completion -->

        <div
            id="completionMessage"
            class="completionMessage"
            hidden
        >

            <div class="completionIcon">
                🎉
            </div>

            <h2>
                Quiz Completed!
            </h2>

            <p>
                Great job! You have reached the end of this quiz.
            </p>

        </div>


    </main>


    <footer class="quizFooter">

        <p>
            🎓 Unique Academic
        </p>

        <span>
            Learn • Practice • Succeed
        </span>

    </footer>

</div>


<!-- =====================================
     ACCESS GUARD + QUIZ DATA LOADING
===================================== -->

<script type="module">

    document.addEventListener(
        "uniqueAcademicAccessGranted",
        () => {

            /*
             * STEP 1
             * Load the original quiz data.
             *
             * IMPORTANT:
             * quizData.js is NOT modified.
             */

            const dataScript =
                document.createElement("script");

            dataScript.src =
                "quizData.js";

            dataScript.onload = () => {

                /*
                 * STEP 2
                 * Load additional quiz data.
                 *
                 * This file adds new chapters
                 * without modifying quizData.js.
                 */

                const additionalDataScript =
                    document.createElement("script");

                additionalDataScript.src =
                    "additionalQuizData.js";

                additionalDataScript.onload = () => {

                    /*
                     * STEP 3
                     * Only after BOTH data files are
                     * successfully loaded, start quiz.js.
                     */

                    const quizScript =
                        document.createElement("script");

                    quizScript.src =
                        "quiz.js";

                    quizScript.onerror = () => {

                        console.error(
                            "Could not load quiz.js"
                        );

                    };

                    document.body.appendChild(
                        quizScript
                    );

                };


                additionalDataScript.onerror = () => {

                    /*
                     * If the additional file is missing,
                     * keep the original quiz system working.
                     */

                    console.error(
                        "Could not load additionalQuizData.js"
                    );

                    const quizScript =
                        document.createElement("script");

                    quizScript.src =
                        "quiz.js";

                    document.body.appendChild(
                        quizScript
                    );

                };


                document.body.appendChild(
                    additionalDataScript
                );

            };


            dataScript.onerror = () => {

                console.error(
                    "Could not load quizData.js"
                );

            };


            document.body.appendChild(
                dataScript
            );

        }
    );

</script>


<!-- =====================================
     FIREBASE ACCESS CHECK
===================================== -->

<script
    type="module"
    src="access-guard.js"
></script>


</body>

</html>

<!DOCTYPE html>  <html lang="en">  <head>  <meta charset="UTF-8">  

<meta  
    name="viewport"  
    content="width=device-width, initial-scale=1.0"  
>  

<meta  
    name="theme-color"  
    content="#8e44ad"  
>  

<title>Unique Academic Quiz</title>  

<link  
    rel="stylesheet"  
    href="quiz.css"  
>

</head>  <body>  <div class="page">  <!-- =====================================  
     STICKY TOP HEADER  
====================================== -->  

<header class="quizHeader">  

    <button  
        id="backBtn"  
        class="topNavBtn backBtn"  
        type="button"  
        aria-label="Go back"  
    >  
        <span class="navIcon">←</span>  
        <span class="backText">Back</span>  
    </button>  


    <div class="headerTitle">  

        <span class="headerBook">📖</span>  

        <div>  

            <h1 id="headerTitle">  
                Unique Academic  
            </h1>  

            <p id="headerChapter">  
                Quiz  
            </p>  

        </div>  

    </div>  


    <button  
        id="homeBtn"  
        class="topNavBtn homeBtn"  
        type="button"  
        aria-label="Go to home"  
    >  
        <span class="homeIcon">⌂</span>  
        <span class="homeText">Home</span>  
    </button>  

</header>  


<!-- =====================================  
     MAIN QUIZ CONTENT  
====================================== -->  

<main  
    class="quizContainer"  
    id="quizContainer"  
>  

    <!-- Subject / Chapter -->  

    <section class="subjectCard">  

        <div class="subjectIcon">  
            🎓  
        </div>  

        <div class="subjectInfo">  

            <p class="smallLabel">  
                CURRENT QUIZ  
            </p>  

            <h2 id="subjectName">  
                Subject  
            </h2>  

            <p id="chapterName">  
                Chapter 1  
            </p>  

        </div>  

    </section>  


    <!-- Progress -->  

    <section class="progressCard">  

        <div class="progressTop">  

            <span>  
                Quiz Progress  
            </span>  

            <strong id="questionNumber">  
                Question 1 / 10  
            </strong>  

        </div>  


        <div class="progressTrack">  

            <div  
                id="progressBar"  
                class="progressBar"  
            ></div>  

        </div>  

    </section>  


    <!-- =====================================  
 QUESTIONS PAGE

====================================== -->

<div id="questionsPage"></div>  <!-- =====================================  
         BOTTOM QUESTION NAVIGATION  
    ====================================== -->  

    <div class="questionNavigation">  

        <button  
            id="previousQuestionBtn"  
            class="questionNavBtn previousQuestionBtn"  
            type="button"  
        >  

            <span class="navArrow">  
                ←  
            </span>  

            <span>  
                Previous  
            </span>  

        </button>  


        <button  
            id="nextBtn"  
            class="questionNavBtn nextQuestionBtn"  
            type="button"  
        >  

            <span>  
                Next  
            </span>  

            <span class="navArrow">  
                →  
            </span>  

        </button>  

    </div>  


    <!-- Completion -->  

    <div  
        id="completionMessage"  
        class="completionMessage"  
        hidden  
    >  

        <div class="completionIcon">  
            🎉  
        </div>  

        <h2>  
            Quiz Completed!  
        </h2>  

        <p>  
            Great job! You have reached the end of this quiz.  
        </p>  

    </div>  


</main>  


<footer class="quizFooter">  

    <p>  
        🎓 Unique Academic  
    </p>  

    <span>  
        Learn • Practice • Succeed  
    </span>  

</footer>

</div>  <!-- =====================================  
     
<script type="module">

document.addEventListener(
    "uniqueAcademicAccessGranted",
    function () {

        console.log(
            "Unique Academic access granted."
        );

        // =====================================================
        // PREVENT QUIZ ENGINE FROM STARTING MORE THAN ONCE
        // =====================================================

        if (
            window.uniqueAcademicQuizStarted
        ) {

            console.log(
                "Quiz system already started."
            );

            return;

        }

        window.uniqueAcademicQuizStarted =
            true;


        // =====================================================
        // LOAD A SCRIPT AND WAIT FOR IT TO FINISH
        // =====================================================

        function loadScript(
            src,
            required = true
        ) {

            return new Promise(
                function (resolve, reject) {

                    const script =
                        document.createElement(
                            "script"
                        );

                    script.src =
                        src;

                    script.async =
                        false;

                    script.onload =
                        function () {

                            console.log(
                                src +
                                " loaded successfully."
                            );

                            resolve();

                        };

                    script.onerror =
                        function () {

                            console.error(
                                "ERROR loading " +
                                src
                            );

                            if (
                                required
                            ) {

                                reject(
                                    new Error(
                                        "Could not load " +
                                        src
                                    )
                                );

                            } else {

                                resolve();

                            }

                        };

                    document.body.appendChild(
                        script
                    );

                }
            );

        }


        // =====================================================
        // START QUIZ
        // =====================================================

        async function startQuiz() {

            try {

                // ---------------------------------------------
                // STEP 1
                // LOAD ORIGINAL QUIZ DATA
                // ---------------------------------------------

                await loadScript(
                    "quizData.js",
                    true
                );


                // ---------------------------------------------
                // VERIFY quizData EXISTS
                // ---------------------------------------------

                if (
                    typeof window.quizData ===
                    "undefined" &&
                    typeof quizData ===
                    "undefined"
                ) {

                    throw new Error(
                        "quizData is not defined after loading quizData.js."
                    );

                }


                console.log(
                    "Original quizData is available."
                );


                // ---------------------------------------------
                // STEP 2
                // LOAD ADDITIONAL QUIZ DATA
                // ---------------------------------------------

                await loadScript(
                    "additionalQuizData.js",
                    false
                );


                // ---------------------------------------------
                // VERIFY DATA AFTER BOTH FILES
                // ---------------------------------------------

                const finalQuizData =
                    typeof window.quizData !==
                    "undefined"
                        ? window.quizData
                        : (
                            typeof quizData !==
                            "undefined"
                                ? quizData
                                : null
                        );


                if (
                    !finalQuizData
                ) {

                    throw new Error(
                        "quizData is unavailable."
                    );

                }


                console.log(
                    "Final quizData:",
                    finalQuizData
                );


                // ---------------------------------------------
                // STEP 3
                // CHECK CURRENT URL
                // ---------------------------------------------

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const subject =
                    params.get(
                        "subject"
                    );


                const chapter =
                    params.get(
                        "chapter"
                    );


                console.log(
                    "Quiz subject:",
                    subject
                );


                console.log(
                    "Quiz chapter:",
                    chapter
                );


                // ---------------------------------------------
                // STEP 4
                // CHECK THAT THE REQUESTED QUIZ EXISTS
                // ---------------------------------------------

                if (
                    !subject ||
                    !chapter
                ) {

                    console.error(
                        "Missing subject or chapter in quiz URL."
                    );

                    return;

                }


                const subjectData =
                    finalQuizData[
                        subject
                    ];


                if (
                    !subjectData
                ) {

                    console.error(
                        "Subject not found in quizData:",
                        subject
                    );

                    console.log(
                        "Available subjects:",
                        Object.keys(
                            finalQuizData
                        )
                    );

                    return;

                }


                const chapterData =
                    subjectData[
                        chapter
                    ];


                if (
                    !Array.isArray(
                        chapterData
                    ) ||
                    chapterData.length === 0
                ) {

                    console.error(
                        "No questions found for:",
                        subject,
                        "chapter:",
                        chapter
                    );

                    console.log(
                        "Available chapters for " +
                        subject +
                        ":",
                        Object.keys(
                            subjectData
                        )
                    );

                    return;

                }


                console.log(
                    "Questions found:",
                    chapterData.length
                );


                // ---------------------------------------------
                // STEP 5
                // LOAD QUIZ ENGINE LAST
                // ---------------------------------------------

                await loadScript(
                    "quiz.js",
                    true
                );


                console.log(
                    "quiz.js loaded successfully."
                );


                // ---------------------------------------------
                // FINAL CHECK
                // ---------------------------------------------

                console.log(
                    "Quiz started successfully:",
                    subject,
                    "Chapter",
                    chapter,
                    chapterData.length,
                    "questions"
                );

            }

            catch (
                error
            ) {

                console.error(
                    "QUIZ START ERROR:",
                    error
                );

            }

        }


        // =====================================================
        // START
        // =====================================================

        startQuiz();

    }
);

</script>

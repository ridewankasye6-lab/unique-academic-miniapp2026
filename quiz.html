<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unique Academic Quiz</title>

<link rel="stylesheet" href="quiz.css">

</head>

<body>

<div class="quiz-container">

    <!-- Header -->
    <header class="quiz-header">

        <button class="back-btn" id="backBtn">
            ←
        </button>

        <div>
            <h1>Unique Academic</h1>
            <p>Learning Platform</p>
        </div>

    </header>

    <!-- Subject -->
    <div class="subject-card">

        <span class="subject-name" id="subjectName"></span>

        <h2 id="chapterTitle"></h2>

    </div>

    <!-- Question -->
    <div class="question-card">

        <h2 class="question-text" id="question"></h2>

        <div class="options" id="options">

        </div>

    </div>

    <!-- Explanation -->
    <div class="answer-box">

        <div class="explanation-card">

            <h3>📖 English Explanation</h3>

            <p id="englishExplanation"></p>

        </div>

        <div class="explanation-card">

            <h3>🇪🇹 የአማርኛ ማብራሪያ</h3>

            <p id="amharicExplanation"></p>

        </div>

    </div>

    <!-- Next Button -->
    <div class="next-area">

        <button id="nextBtn" class="next-btn">
            Next Question →
        </button>

    </div>

</div>

<script src="quizData.js"></script>
<script src="quiz.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Unique Academic Quiz</title>

    <link rel="stylesheet" href="quiz.css">

</head>

<body>

<div class="quiz-container">

    <!-- Header -->

    <header class="quiz-header">

        <button class="back-btn">
            ←
        </button>

        <div>

            <h1>Unique Academic</h1>

            <p>Learning Platform</p>

        </div>

    </header>
    <div class="subject-card">
        <div class="progress-card">

    <div class="progress-top">

        <span class="question-count">
            Question 1 of 20
        </span>

        <span class="progress-percent">
            5%
        </span>

    </div>

    <div class="progress-bar">
        
<div class="question-card">

    <div class="question-title">
        Question
    </div>

    <h2 class="question-text">
        What is International Relations primarily concerned with?
    </h2>

    <div class="answers">

        <label class="answer-card">
            <input type="radio" name="answer">
            <span>A. Domestic Politics</span>
        </label>

        <label class="answer-card">
            <input type="radio" name="answer">
            <span>B. Relations Between States</span>
        </label>

        <label class="answer-card">
            <input type="radio" name="answer">
            <span>C. Mathematics</span>
        </label>

        <label class="answer-card">
            <input type="radio" name="answer">
            <span>D. Biology</span>
        </label>

    </div>

</div>
        <div class="progress-fill"></div>

    </div>

</div>

    <span class="subject-name">
        🌍 Global Trends
    </span>

    <h2>
        Chapter 1 Quiz
    </h2>

    <p>
        Understanding International Relations
    </p>

</div>

</div>

<script src="quiz.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Academic Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header class="header">

        <button id="backBtn" class="btn backBtn">
            ← Back
        </button>

        <h1>Unique Academic</h1>

        <button id="homeBtn" class="btn homeBtn">
            🏠 Home
        </button>

    </header>

    <!-- Subject -->
    <div class="subjectBox">

        <h2 id="subjectName">Subject</h2>

        <p id="chapterName">Chapter 1</p>

    </div>

    <!-- Progress -->
    <div class="progress">

        <span id="questionNumber">
            Question 1 / 10
        </span>

    </div>

    <!-- Question -->
    <div class="questionBox">

        <h2 id="question"></h2>

        <div id="options"></div>

    </div>

    <!-- Explanation -->
    <div class="explanation">

        <h3>📖 English Explanation</h3>

        <p id="englishExplanation"></p>

        <h3>🇪🇹 የአማርኛ ማብራሪያ</h3>

        <p id="amharicExplanation"></p>

    </div>

    <!-- Next -->
    <button id="nextBtn" class="nextBtn">

        Next Question →

    </button>

</div>

<script src="quizData.js"></script>
<script src="quiz.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>📊 Economics Chapters</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           ECONOMICS CHAPTER PAGE
        ========================================= */

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(
                180deg,
                #315fca,
                #5eb7cf
            );
        }


        /* =========================================
           HEADER
        ========================================= */

        .economics-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 20px;

            color: white;
        }


        .economics-back {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(120, 70, 180, 0.8);

            color: white;

            text-decoration: none;

            font-size: 28px;
        }


        .economics-title {
            font-size: 25px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            margin: 0 15px;
        }


        .economics-help {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(120, 70, 180, 0.8);

            color: white;

            font-size: 24px;
        }


        /* =========================================
           CHAPTER CONTAINER
        ========================================= */

        .economics-chapters {
            padding: 25px 18px 50px;
        }


        /* =========================================
           CHAPTER CARD
        ========================================= */

        .economics-card {

            display: flex;
            align-items: center;

            width: 100%;

            min-height: 115px;

            margin-bottom: 25px;

            padding: 18px 18px;

            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.94);

            border-radius: 25px;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.16);

            text-decoration: none;

            color: #111;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .economics-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.20);
        }


        /* =========================================
           PROGRESS CIRCLE
        ========================================= */

        .economics-progress {

            width: 76px;
            height: 76px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 700;

            color: #d95643;

            background:

                radial-gradient(
                    circle,
                    white 58%,
                    transparent 59%
                ),

                conic-gradient(
                    #df543f var(--progress),
                    #eeeeee 0
                );
        }


        /* =========================================
           CHAPTER INFORMATION
        ========================================= */

        .economics-info {

            flex: 1;

            min-width: 0;

            margin-left: 22px;
        }


        .economics-badge {

            display: inline-block;

            padding: 5px 13px;

            margin-bottom: 7px;

            border-radius: 8px;

            background: #e5dff0;

            border: 1px solid #c9bddc;

            color: #4e4658;

            font-size: 15px;

            font-weight: 700;
        }


        .economics-info h2 {

            margin: 0;

            font-size: 22px;

            line-height: 1.35;

            font-weight: 700;

            color: #111;
        }


        /* =========================================
           ARROW
        ========================================= */

        .economics-arrow {

            flex-shrink: 0;

            margin-left: 10px;

            font-size: 38px;

            font-weight: 300;

            color: #777;

            line-height: 1;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            .economics-title {
                font-size: 21px;
            }

            .economics-card {
                min-height: 115px;
                padding: 16px;
            }

            .economics-progress {
                width: 70px;
                height: 70px;
                font-size: 16px;
            }

            .economics-info {
                margin-left: 16px;
            }

            .economics-info h2 {
                font-size: 20px;
            }

            .economics-arrow {
                font-size: 34px;
            }
        }


        /* =========================================
           DARK MODE
        ========================================= */

        .dark-mode .economics-card {
            background: #20242b;
            color: white;
        }

        .dark-mode .economics-info h2 {
            color: white;
        }

        .dark-mode .economics-badge {
            background: #393246;
            color: #eee;
            border-color: #51475f;
        }

        .dark-mode .economics-progress {
            background:
                radial-gradient(
                    circle,
                    #20242b 58%,
                    transparent 59%
                ),
                conic-gradient(
                    #df543f var(--progress),
                    #444 0
                );
        }

        .dark-mode .economics-arrow {
            color: #bbb;
        }

    </style>

</head>
